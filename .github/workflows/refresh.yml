name: Refresh deals

on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # "Run workflow" button on GitHub for an instant refresh
  push:
    branches: [main]
    paths: [build_deals.py, rules.json]

permissions:
  contents: write

concurrency:
  group: refresh-deals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Find today's deals
        run: python3 build_deals.py

      - name: Publish deals.json
        run: |
          git config user.name  "tdp-daily-deals bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh deals ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --quiet
            git push
          fi
